<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 180" width="100%" height="100%">
  <defs>
    <!-- Blue Gradient for G -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0b2347" />
    </linearGradient>

    <!-- Orange Gradient for Z & Arrow -->
    <linearGradient id="orangeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Arrow head shadow -->
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left Symbol Group -->
  <g transform="translate(15, 10)">
    <!-- Letter Z (Orange - background layer) -->
    <path d="M 125,50 L 195,50 L 195,68 L 138,135 L 205,135 L 205,155 L 115,155 L 115,138 L 175,68 L 125,68 Z" fill="url(#orangeGrad)" />

    <!-- Letter G (Blue - foreground layer) -->
    <!-- Outer arc of G -->
    <path d="M 115,35 
             C 70,35 32,65 32,105 
             C 32,145 70,175 115,175 
             C 135,175 152,168 165,158 
             L 150,140 
             C 140,148 128,153 115,153 
             C 85,153 56,132 56,105 
             C 56,78 85,57 115,57 
             C 132,57 146,64 156,75 
             L 174,58 
             C 159,44 138,35 115,35 Z" 
          fill="url(#blueGrad)" />

    <!-- G's inward horizontal crossbar -->
    <path d="M 105,95 L 155,95 L 155,115 L 125,115 L 125,128 L 105,128 Z" fill="url(#blueGrad)" />

    <!-- Upward Swoosh with Growth Arrow -->
    <!-- Curved swoosh starting from bottom left wrapping under G and slicing through Z -->
    <path d="M 22,125 
             C 25,155 55,182 105,180 
             C 140,178 175,150 205,100 
             L 218,80 
             C 185,130 145,160 102,160 
             C 65,160 40,140 38,125 Z" 
          fill="url(#orangeGrad)" />

    <!-- Arrow head pointing up-right -->
    <polygon points="195,85 240,40 215,95 210,75" fill="url(#orangeGrad)" filter="url(#subtleGlow)" />
  </g>

  <!-- Vertical Divider Line -->
  <line x1="260" y1="35" x2="260" y2="155" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />

  <!-- Right Text Group -->
  <g transform="translate(280, 0)">
    <!-- GEN in navy blue, Z in orange -->
    <text x="0" y="82" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="1">
      <tspan fill="#0b2347">GEN </tspan>
      <tspan fill="#f97316">Z</tspan>
    </text>

    <!-- ENTERPRISE in uppercase tracked -->
    <text x="3" y="118" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="#0b2347" letter-spacing="7.5">
      ENTERPRISE
    </text>

    <!-- Tagline: Ideas Today | Growth Tomorrow -->
    <text x="4" y="145" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="500" font-size="14.5" fill="#475569" letter-spacing="1.2">
      <tspan fill="#334155">Ideas Today</tspan>
      <tspan fill="#94a3b8">  |  </tspan>
      <tspan fill="#334155">Growth Tomorrow</tspan>
    </text>
  </g>
</svg>
